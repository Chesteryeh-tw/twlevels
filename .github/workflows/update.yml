name: 更新台股盤後資料

on:
  schedule:
    # 一天跑兩次，因為證交所的資料不是一次出齊的。
    #
    #   三大法人（T86）        16:00 前就有
    #   融資融券（MI_MARGN）   晚上 21:30 才公布
    #                          （2026-09-21 實測：18:00 還是 0 筆，隔天 13:45 有 1981 筆）
    #
    # 只排一次的話，早跑漏融資、晚跑則是收盤後好幾小時都看不到當天的行情。
    # 所以拆成兩次，各司其職：
    #
    #   08:00 UTC = 台北 16:00　行情 + 指標 + 三大法人，收盤後馬上能選股
    #   14:00 UTC = 台北 22:00　回頭把當天的融資融券補上
    #
    # 22:00 不是 21:30 —— 公布時間就是 21:30，排在同一分鐘等於跟它搶，
    # 對方晚個幾分鐘就又抓到空的。留 30 分鐘餘裕。
    # GitHub 的排程尖峰時可能再延後幾十分鐘，那是往安全的方向偏，無所謂。
    # 真的還是漏了也不會壞：chips.py 會回頭補前 5 天，隔天那兩次會接手。
    - cron: '0 8 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:        # 也可以在網頁上手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取全市場盤後資料
        run: python fetch.py

      - name: 計算技術指標
        run: python indicators.py

      # 以下是籌碼面。任何一段掛掉都不該讓當天的行情更新跟著失敗，
      # 所以都設 continue-on-error —— 隔天排程會自動補上。
      - name: 集保股權分散（每週更新，重複跑會自動略過）
        continue-on-error: true
        run: python tdcc.py

      - name: 三大法人與融資融券
        continue-on-error: true
        run: python chips.py

      - name: 有變動就存回倉庫
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料沒有變動，不提交。"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
