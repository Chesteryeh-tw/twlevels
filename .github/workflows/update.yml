name: 更新台股盤後資料

on:
  schedule:
    # 08:00 UTC = 台北時間 16:00，週一到週五
    # GitHub 的排程尖峰時可能延後幾十分鐘，屬正常
    - cron: '0 8 * * 1-5'
  workflow_dispatch:        # 也可以在網頁上手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出倉庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取全市場盤後資料
        run: python fetch.py

      - name: 有變動就存回倉庫
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "資料沒有變動，不提交。"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
