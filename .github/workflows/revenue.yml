name: 月營收（公開資訊觀測站）＋ 因子測試

# 2026-10-22 打開每月排程：R1、R3、R5 在驗證期通過（研究_免費資料因子 第 5 節），
# 要開始累積「當時公布的版本」（11 日抓一次、更正後的舊版另存），以後才能從探索升級。
# 台灣時間每月 11 日 19:30（避開 16:00、22:00 的台股更新）。
# 原始檔只放 Actions 快取，不進 repo（歷史檔的授權範圍還沒確認）；只 commit 統計報告。
on:
  schedule:
    - cron: '30 11 11 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "先選 test（1 分鐘），通過再選 full"
        type: choice
        options: [test, full, early, export_early, early_universe]
        default: test

permissions:
  contents: write

concurrency:
  group: revenue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ inputs.mode || 'full' }}    # 之後加排程時，排程觸發沒有 inputs，當 full

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 測試（只抓 2021-01 上市、上櫃各一份，不寫檔）
        if: env.MODE == 'test'
        run: python revenue_fetch.py --test

      # SUS 事先登記 v2.3 第 7 節：早年營收先抓 2017-12 上市、上櫃 2 份，只看格式與列數（不碰 manifest、不建 panel）
      - name: 還原已抓的月營收（early）
        if: env.MODE == 'early'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 早年試抓 2017-12（2 份）
        if: env.MODE == 'early'
        run: python revenue_fetch.py --early-probe 201712

      - name: 還原已抓的月營收（export_early）
        if: env.MODE == 'export_early'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 匯出早年試抓清單與原始檔（給 GPT 複核母體；只放下載區 30 天，不進 repo）
        if: env.MODE == 'export_early'
        run: python revenue_fetch.py --export-early

      - name: 上傳早年原始檔與清單
        if: env.MODE == 'export_early'
        uses: actions/upload-artifact@v4
        with:
          name: revenue-early
          path: |
            data/revenue_raw/early/*.csv
            early_check/early_codes.csv
            early_check/early_files.json
          retention-days: 30

      # 代號清單沒有營收金額，只有公司代號、名稱、產業別、日期；原始 CSV 不進 repo
      - name: 推回早年代號清單
        if: env.MODE == 'export_early'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f early_check/early_codes.csv early_check/early_files.json
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "早年營收試抓：代號清單與檔案雜湊（不含營收金額）"
            git pull --rebase --autostash
            git push
          fi

      # 早年營收缺碼 vs 研究母體（GPT 07）：只讀快取、不連網；輸出只有代碼與次數
      - name: 還原已抓的月營收（early_universe）
        if: env.MODE == 'early_universe'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 還原股價歷史（early_universe）
        id: hist
        if: env.MODE == 'early_universe'
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-2021-01-01-
          restore-keys: |
            finmind-hist-2021-01-01-
            finmind-hist-

      - name: 核對缺碼（不連網）
        if: env.MODE == 'early_universe'
        run: |
          echo "::notice::股價歷史快取命中的鍵：'${{ steps.hist.outputs.cache-matched-key }}'（空白＝沒有命中）"
          python test_early_universe.py
          python revenue_fetch.py --panel-only
          python early_universe_check.py
          python early_universe_diag.py

      - name: 推回缺碼核對結果
        if: env.MODE == 'early_universe'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f early_check/universe_check.csv early_check/universe_check.md early_check/universe_diag.md
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "早年營收缺碼 vs 研究母體核對（只有代碼與次數）"
            git pull --rebase --autostash
            git push
          fi

      - name: 存進快取（early）
        if: always() && env.MODE == 'early'
        uses: actions/cache/save@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-${{ github.run_id }}

      - name: 還原已抓的月營收
        if: env.MODE == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 抓月營收（已驗過的跳過，最近 3 個月重抓）
        id: fetch
        if: env.MODE == 'full'
        continue-on-error: true      # 有幾個月失敗也要先存快取、下面再判斷
        run: python revenue_fetch.py

      - name: 存進快取
        if: always() && env.MODE == 'full'
        uses: actions/cache/save@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-${{ github.run_id }}

      # 因子測試要 2021 起的股價：用 finmind.yml 補好的歷史（沒跑過就只有 repo 裡的近一年）
      - name: 還原股價歷史
        if: env.MODE == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-2021-01-01-
          restore-keys: |
            finmind-hist-2021-01-01-
            finmind-hist-

      - name: 重建營收表、跑因子測試
        if: env.MODE == 'full'
        run: |
          python revenue_fetch.py --panel-only
          python factor_revenue.py

      # 只 commit 報告。絕對不要改成 git add data/ —— 營收原始檔和 FinMind 股價都不能進 repo。
      - name: 推回報告
        if: env.MODE == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f revenue_report.md revenue_report.json
          [ -d data/revenue_snapshots_meta ] && git add -f data/revenue_snapshots_meta
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "月營收因子測試報告"
            # --autostash：data/stock 被快取還原改過但沒 commit，一般 pull --rebase 會拒絕
            git pull --rebase --autostash
            git push
          fi

      # 逐筆清單（給 GPT 複核）。只放 Actions 下載區、保留 30 天，不 commit 進 repo。
      - name: 月營收逐筆清單
        if: always() && env.MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: revenue-events
          path: revenue_events_*.csv
          retention-days: 30
          if-no-files-found: warn

      - name: 摘要
        if: always() && env.MODE == 'full'
        run: |
          echo "### 月營收" >> $GITHUB_STEP_SUMMARY
          [ -f revenue_report.md ] && head -40 revenue_report.md >> $GITHUB_STEP_SUMMARY || echo "沒有報告" >> $GITHUB_STEP_SUMMARY

      - name: 抓取有失敗就標紅
        if: always() && env.MODE == 'full' && steps.fetch.outcome == 'failure'   # 沒有 always() 時前一步失敗會被跳過
        run: |
          echo "有月份抓取失敗或被擋，看「抓月營收」那一步的紀錄。已抓到的已存進快取，下次會接著抓。"
          exit 1
