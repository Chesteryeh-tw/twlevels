name: 權證官方日資料 ＋ H5 認購買超排行

# 2026-10-24 新增（研究_權證分點 H5）。只抓證交所公開的 T86 權證類別、MI_INDEX 權證行情、FMTQIK。
# 原始檔只放 Actions 快取，不進 repo；結果寫成 Actions 註記＋下載區（30 天）。
# 不要跟 update.yml、finmind.yml 同時跑（都會打證交所）。
# 2026-10-24 使用者同意：每天台灣時間 03:10 自動接著抓（抓完後每天只補前一天 4 份）；間隔 4～7 秒隨機，
# 被擋一次上限 +1 秒，到 12 秒還被擋就停止自動續抓、標紅等人處理。
on:
  schedule:
    - cron: '10 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "probe＝抓一天看欄位；full＝從 2024-10 抓到昨天＋回測；study＝不連證交所，只用已抓的資料重算；check＝不連證交所，輸出核對指紋；list＝不連證交所，輸出權證每日母體清單（下載區）"
        type: choice
        options: [probe, probe2, full, study, check, list]
        default: probe
      probe_date:
        description: "probe 用的日期 YYYYMMDD（空白＝昨天）"
        required: false
        default: ""

permissions:
  contents: read
  actions: write        # 只用來刪掉舊的權證快取（每次存一份新的，舊的不刪會把 FinMind 股價快取擠掉）

concurrency:
  group: warrant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      MODE: ${{ inputs.mode || 'full' }}     # 排程觸發沒有 inputs → full
      WARRANT_BUDGET_MIN: "290"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 探測（不寫檔）
        if: env.MODE == 'probe'
        run: python warrant_fetch.py --probe ${{ inputs.probe_date }}

      - name: 探測第二輪（表格欄位、T86 其他寫法；不寫檔）
        if: env.MODE == 'probe2'
        run: python warrant_fetch.py --probe2 ${{ inputs.probe_date }}

      - name: 還原已抓的權證資料
        if: env.MODE == 'full' || env.MODE == 'study' || env.MODE == 'check' || env.MODE == 'list'
        uses: actions/cache/restore@v4
        with:
          path: data/warrant_raw
          key: warrant-raw-
          restore-keys: |
            warrant-raw-

      - name: 抓權證（已抓的跳過；時間到就停，下次接著抓）
        id: fetch
        if: env.MODE == 'full'
        continue-on-error: true
        run: python warrant_fetch.py

      - name: 只重建（不連網）
        if: env.MODE == 'study'
        run: python warrant_fetch.py --derive-only

      # 2026-10-27：跟 GPT 交來的官方原始檔（TWT43U＋MI_INDEX）核對；只輸出筆數、加總、雜湊
      - name: 核對指紋（不連網、不存快取）
        if: env.MODE == 'check'
        run: python warrant_check.py --derived 20260902 20261022

      # 2026-10-27：給 GPT 排權證分點抓取用的每日母體（含已到期權證）；私人，只放下載區
      - name: 權證每日母體清單（不連網）
        if: env.MODE == 'list'
        run: python warrant_universe.py 20241001 20991231

      - name: 母體清單下載區
        if: env.MODE == 'list'
        uses: actions/upload-artifact@v4
        with:
          name: warrant-universe
          path: |
            warrant_universe_daily.csv.gz
            warrant_universe_summary.csv
            warrant_universe_readme.md
          retention-days: 30

      - name: 存進快取
        if: always() && env.MODE == 'full'
        uses: actions/cache/save@v4
        with:
          path: data/warrant_raw
          key: warrant-raw-${{ github.run_id }}

      - name: 刪掉舊的權證快取（只留剛存的這份）
        if: always() && env.MODE == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="warrant-raw-${{ github.run_id }}"
          gh cache list --repo "${{ github.repository }}" --key warrant-raw- --limit 100 --json key --jq '.[].key' \
            | while read k; do
                if [ "$k" != "$keep" ] && gh cache list --repo "${{ github.repository }}" --key "$keep" --json key --jq '.[].key' | grep -qx "$keep"; then
                  gh cache delete "$k" --repo "${{ github.repository }}" && echo "刪除 $k"
                fi
              done

      - name: 還原股價歷史
        if: always() && (env.MODE == 'full' || env.MODE == 'study')
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-2021-01-01-
          restore-keys: |
            finmind-hist-2021-01-01-
            finmind-hist-

      - name: H5 回測
        if: always() && (env.MODE == 'full' || env.MODE == 'study')
        run: python warrant_study.py

      - name: 結果下載區
        if: always() && (env.MODE == 'full' || env.MODE == 'study')
        uses: actions/upload-artifact@v4
        with:
          name: warrant-h5
          path: |
            warrant_study_report.md
            warrant_h5_events.csv
          retention-days: 30
          if-no-files-found: warn

      - name: 摘要
        if: always() && (env.MODE == 'full' || env.MODE == 'study')
        run: |
          echo "### 權證 H5" >> $GITHUB_STEP_SUMMARY
          [ -f warrant_study_report.md ] && cat warrant_study_report.md >> $GITHUB_STEP_SUMMARY || echo "沒有報告" >> $GITHUB_STEP_SUMMARY

      - name: 抓取有問題就標紅
        if: always() && env.MODE == 'full' && steps.fetch.outcome == 'failure'   # 沒有 always() 時前一步失敗會被跳過
        run: |
          echo "抓取被擋或中斷，看「抓權證」那一步。已抓到的已存進快取。"
          exit 1
