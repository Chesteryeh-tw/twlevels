name: 官方日行情核對 SUS 歷史母體（手動）

# SUS 登記 v2.5 第 10 節／GPT 09 第 2 節：按 SUS 兩版每個營收月的進場前一交易日，抓證交所 MI_INDEX 與櫃買 dailyQuotes，
# 算官方成交 ≥ 1 億的母體，跟本地長期價量比，量出「本地缺了哪些代號」（存活選樣幅度）。不算 SUS、不看績效。
# 約 136 個日期 × 2 市場，4～7 秒一次；一次最多抓 50 分鐘，沒抓完再跑一次會接著抓。被拒（403 等）就整批停。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warrant          # 跟權證、公司行動抓取排隊，不同時打證交所
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 還原股價歷史
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-2021-01-01-
          restore-keys: |
            finmind-hist-2021-01-01-
            finmind-hist-
      - name: 還原已抓的官方行情
        uses: actions/cache/restore@v4
        with:
          path: data/uni_raw
          key: uni-raw-
          restore-keys: |
            uni-raw-
      - name: 測試
        run: python test_early_universe.py
      - name: 抓官方行情、比對
        id: run
        run: |
          set +e
          python universe_official_check.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 存官方行情快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/uni_raw
          key: uni-raw-${{ github.run_id }}
      - name: 推回比對結果（只有代碼、日期、家數）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f early_check/universe_official.md early_check/universe_official_dates.csv early_check/universe_official_missing.csv
          if git diff --cached --quiet; then echo "沒有變動"; else
            git commit -m "官方日行情核對 SUS 歷史母體"
            git pull --rebase --autostash
            git push
          fi
      - name: 被拒就標紅
        if: steps.run.outputs.code == '2'
        run: |
          echo "官方網站拒絕或轉址，已停止。已抓到的已存快取。"
          exit 1
