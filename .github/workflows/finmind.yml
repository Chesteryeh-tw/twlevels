name: FinMind 補歷史 + 重跑回測

# 手動觸發。不排程 —— 這個要跑好幾小時，不該每天自動跑。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "先選 test 驗一下（1 分鐘），沒問題再選 full"
        type: choice
        options: [test, full]
        default: test
      start_date:
        description: "要補到哪一年（full 才有用）"
        default: "2021-01-01"
      adjust:
        description: "另外跑一次公司行動調整版（除權息、減資、面額變更），存成 backtest_adj.json，不蓋原本的"
        type: boolean
        default: false
      explore:
        description: "重算回測工具（69 個條件單一與兩兩組合、做多做空），存成 data/bt_explore*.json"
        type: boolean
        default: false
      patterns:
        description: "K 線型態長樣本回測（15 種，多空），存成 data/bt_patterns.json"
        type: boolean
        default: false
      smc:
        description: "SMC／ICT＋分價量表 長樣本回測（12 種，多空），存成 data/bt_smc.json"
        type: boolean
        default: false
      squeeze:
        description: "開布林擠壓門檻掃描（固定 vs 動態），存成 data/bt_squeeze.json"
        type: boolean
        default: false
      patexit:
        description: "K 線型態·停損＋目標價出場回測，存成 data/bt_patexit.json"
        type: boolean
        default: false
      anatomy:
        description: "大漲／大跌前的條件解剖，存成 data/study_anatomy.json"
        type: boolean
        default: false
      pullback:
        description: "回踩支撐反彈／反彈壓回（64 格），存成 data/bt_pullback.json"
        type: boolean
        default: false
      granville:
        description: "葛蘭碧八大法則（含假突破／假跌破，32 格）＋開布林深度×開口×量（108 格）"
        type: boolean
        default: false

permissions:
  contents: write

# 跟 finmind_chips.yml 共用同一個 FinMind 帳號的流量上限，不要同時跑
concurrency:
  group: finmind-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 上限 6 小時，留一點餘裕

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 抓下來的歷史很大（五年約 110 MB），不進 repo，放在 Actions 的快取裡。
      # 下次再跑會先還原，已經抓好的就跳過，所以第二次會快很多。
      - name: 還原上次抓好的歷史
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-${{ inputs.start_date }}-
          restore-keys: |
            finmind-hist-${{ inputs.start_date }}-
            finmind-hist-

      # finmind_chips.yml 補好的三大法人、融資融券（2021 起）。沒跑過就沒有，回測照舊只用官方的。
      - name: 還原 FinMind 籌碼快取
        if: inputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/chip_fm
          key: finmind-chips-${{ inputs.start_date }}-
          restore-keys: |
            finmind-chips-${{ inputs.start_date }}-
            finmind-chips-

      # daytrade.yml 抓好的現股當沖（回測工具、解剖的「當沖率」條件用）。沒跑過就沒有，那幾個條件會是 0 筆。
      - name: 還原當沖快取
        if: inputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/daytrade
          key: daytrade-
          restore-keys: |
            daytrade-

      - name: 測試（只抓 3 檔、不寫檔）
        if: inputs.mode == 'test'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python finmind_backfill.py --test

      - name: 正式補歷史
        if: inputs.mode == 'full'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python finmind_backfill.py "${{ inputs.start_date }}"

      # 抓完馬上存，不要等整個 job 成功。
      # 上一次就是因為最後一步失敗，cache 的 post 步驟被跳過，3.7 小時的下載全白費。
      - name: 立刻把抓好的歷史存進快取
        if: always() && inputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: data/stock
          key: finmind-hist-${{ inputs.start_date }}-${{ github.run_id }}

      # 官方 data/chip/ 沒有的日子用 FinMind 補（官方優先）。
      # 補出來的日檔只存在這趟 job 裡：下面的 commit 只加指定的報告檔，
      # 絕對不要改成 git add data/ —— FinMind 條款不准轉散布原始資料。
      - name: 併入 FinMind 籌碼歷史
        if: inputs.mode == 'full'
        run: python finmind_chips.py --merge

      # revenue.yml 抓好的月營收（給「營收年增 > 0／≤ 0」濾網用）。沒跑過就沒有，那幾組會是 0 筆。
      - name: 還原月營收快取
        if: inputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 建月營收表
        if: inputs.mode == 'full'
        run: |
          if [ -f data/revenue_raw/manifest.json ]; then python revenue_fetch.py --panel-only; else echo "沒有月營收快取，略過"; fi

      - name: 重算指標
        if: inputs.mode == 'full'
        run: python indicators.py

      - name: 重跑回測
        if: inputs.mode == 'full'
        # --rally：疑似起漲／疑似起跌事件的三個事先登記（研究_起漲與型態 第 5 節），結果在 backtest.json 的 rally_rows
        run: python backtest.py --rules --exits --rally

      - name: 產生報告
        if: inputs.mode == 'full'
        run: python btreport.py

      - name: 回測標籤給主站用
        if: inputs.mode == 'full'
        run: python bttags.py

      # 2026-10-27：公司行動調整層（backtest.py --adjust）。只在勾選時跑，結果另存，主站仍用原本的
      - name: 公司行動調整版回測（另存）
        if: inputs.mode == 'full' && inputs.adjust
        run: python backtest.py --exits --adjust

      # 2026-10-27：回測工具（bt.html）的資料
      - name: 回測工具
        if: inputs.mode == 'full' && inputs.explore
        run: |
          pip install -q numpy
          python bt_explore.py

      # 2026-10-27：K 線型態（patterns.py）長樣本回測，事先登記寫在 bt_patterns.py 開頭
      - name: K 線型態回測
        if: inputs.mode == 'full' && inputs.patterns
        run: python bt_patterns.py

      # 2026-10-27：SMC／ICT（smc.py）長樣本回測，事先登記寫在 bt_smc.py 開頭
      - name: SMC 回測
        if: inputs.mode == 'full' && inputs.smc
        run: python bt_smc.py

      # 2026-10-28：開布林擠壓門檻掃描，事先登記寫在 bt_squeeze.py 開頭
      - name: 擠壓門檻掃描
        if: inputs.mode == 'full' && inputs.squeeze
        run: python bt_squeeze.py

      # 2026-10-29：葛蘭碧、開布林深度開口，事先登記寫在各程式開頭
      - name: 葛蘭碧與開布林深度開口
        if: inputs.mode == 'full' && inputs.granville
        run: |
          python bt_granville.py
          python bt_bopen2.py
          python rev_flags.py

      # 2026-10-28：回踩支撐反彈，事先登記寫在 bt_pullback.py 開頭
      - name: 回踩反彈回測
        if: inputs.mode == 'full' && inputs.pullback
        run: python bt_pullback.py

      # 2026-10-28：大漲／大跌前的條件解剖（事後描述，不是訊號）
      - name: 大漲大跌解剖
        if: inputs.mode == 'full' && inputs.anatomy
        run: |
          pip install -q numpy
          python study_anatomy.py

      # 2026-10-28：型態停損＋目標價出場，事先登記寫在 bt_patexit.py 開頭
      - name: 型態停損目標回測
        if: inputs.mode == 'full' && inputs.patexit
        run: python bt_patexit.py

      # 只 commit 報告，不 commit 原始歷史 —— 那 110 MB 留在快取裡就好，
      # 進了 repo 之後每次 checkout 都要多下載一次，而且永遠刪不掉。
      - name: 推回報告
        if: inputs.mode == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 每一步失敗都把 git 的回應寫成註記（容器讀不到 Actions 日誌，只讀得到註記）
          run_git(){ out=$("$@" 2>&1) && rc=0 || rc=$?; if [ $rc -ne 0 ]; then echo "::error title=$1 $2 失敗::rc=$rc $(echo "$out" | tail -8 | tr '\n' ' ' | cut -c1-900)"; exit $rc; fi; }
          ls -la data/bt_series.json backtest.json data/bt_tags.json || true
          run_git git add -f backtest.json backtest.html data/daily.txt data/bt_tags.json data/bt_series.json $(ls backtest_adj.json data/bt_series_adj.json data/bt_explore.json data/bt_explore_h1.json data/bt_explore_h5.json data/bt_explore_h10.json data/bt_explore_h20.json data/bt_explore_curve_1.json data/bt_explore_curve_5.json data/bt_explore_curve_10.json data/bt_explore_curve_20.json data/bt_patterns.json data/bt_smc.json data/bt_squeeze.json data/bt_patexit.json data/study_anatomy.json data/bt_pullback.json data/bt_granville.json data/bt_bopen2.json data/rev_flags.json 2>/dev/null)
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            run_git git commit -m "FinMind 補歷史後重跑回測（起始 ${{ inputs.start_date }}）"
            # --autostash：補完歷史之後 data/stock 底下上千個檔案都被改過但沒 commit，
            # 一般的 pull --rebase 碰到未提交的變動會直接拒絕。autostash 會先收起來、
            # rebase 完再放回去 —— 不能用 checkout 丟掉，那些檔案還要留給快取保存。
            run_git git pull --rebase --autostash
            run_git git push
            echo "::notice title=推回報告::完成 $(git log -1 --format=%h)"
          fi

      # 疑似起漲／疑似起跌逐筆清單（給 GPT 複核）。只放 Actions 下載區、保留 30 天，不 commit 進 repo。
      - name: 疑似起漲疑似起跌逐筆清單
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: rally-events
          path: rally_events.csv
          retention-days: 30
          if-no-files-found: warn

      # 就算前面哪一步失敗，也把已經算好的東西存成 artifact，
      # 不要讓幾小時的計算跟著一起消失。
      - name: 失敗時也把結果留下來
        if: failure() && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output
          path: |
            backtest.json
            backtest.html
            data/daily.txt
          if-no-files-found: warn

      - name: 摘要
        if: inputs.mode == 'full'
        run: |
          echo "### 回測重跑完成" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("backtest.json", encoding="utf-8"))
          print("樣本期間 %s ~ %s，共 **%d** 個交易日\n" % (d["from"], d["to"], d["days"]))
          print("| 情境 | 方向 | 20 天超額 | t |")
          print("|---|---|---|---|")
          for r in d["rows"]:
              x = r["h"].get("20")
              if not x:
                  continue
              s = -1 if r["side"] == "空" else 1
              t = x["t"]
              print("| %s | %s | %+.2f%% | %s |" % (
                  r["name"], r["side"], s * x["excess"],
                  ("%+.1f" % (s * t)) if t is not None else "—"))
          if d.get("rally_rows"):
              print("\n#### 疑似起漲／疑似起跌（40 天，登記驗證期 2021-02～2025-08）\n")
              print("| 分組 | 筆數 | 超額（≥1億基準）| t | 比同流動性 | t | 淨 |")
              print("|---|---|---|---|---|---|---|")
              for r in d["rally_rows"]:
                  p = [x for x in r["periods"] if x["name"].startswith("登記驗證期")][0]
                  x = p["h"]["40"]
                  if "excess" not in x:
                      print("| %s | %d | — | — | — | — | — |" % (r["name"], x["n"]))
                      continue
                  f = lambda v: "—" if v is None else "%+.1f" % v
                  print("| %s | %d | %+.2f%% | %s | %+.2f%% | %s | %+.2f%% |" % (
                      r["name"], x["n"], x["excess"], f(x["t"]), x["vs_liq"], f(x["t_liq"]), x["net"]))
          EOF
