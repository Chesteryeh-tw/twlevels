name: FinMind 補歷史 + 重跑回測

# 手動觸發。不排程 —— 這個要跑好幾小時，不該每天自動跑。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "先選 test 驗一下（1 分鐘），沒問題再選 full"
        type: choice
        options: [test, full]
        default: test
      start_date:
        description: "要補到哪一年（full 才有用）"
        default: "2021-01-01"

permissions:
  contents: write

# 跟 finmind_chips.yml 共用同一個 FinMind 帳號的流量上限，不要同時跑
concurrency:
  group: finmind-api
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 上限 6 小時，留一點餘裕

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 抓下來的歷史很大（五年約 110 MB），不進 repo，放在 Actions 的快取裡。
      # 下次再跑會先還原，已經抓好的就跳過，所以第二次會快很多。
      - name: 還原上次抓好的歷史
        uses: actions/cache/restore@v4
        with:
          path: data/stock
          key: finmind-hist-${{ inputs.start_date }}-
          restore-keys: |
            finmind-hist-${{ inputs.start_date }}-
            finmind-hist-

      # finmind_chips.yml 補好的三大法人、融資融券（2021 起）。沒跑過就沒有，回測照舊只用官方的。
      - name: 還原 FinMind 籌碼快取
        if: inputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/chip_fm
          key: finmind-chips-${{ inputs.start_date }}-
          restore-keys: |
            finmind-chips-${{ inputs.start_date }}-
            finmind-chips-

      - name: 測試（只抓 3 檔、不寫檔）
        if: inputs.mode == 'test'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python finmind_backfill.py --test

      - name: 正式補歷史
        if: inputs.mode == 'full'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python finmind_backfill.py "${{ inputs.start_date }}"

      # 抓完馬上存，不要等整個 job 成功。
      # 上一次就是因為最後一步失敗，cache 的 post 步驟被跳過，3.7 小時的下載全白費。
      - name: 立刻把抓好的歷史存進快取
        if: always() && inputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: data/stock
          key: finmind-hist-${{ inputs.start_date }}-${{ github.run_id }}

      # 官方 data/chip/ 沒有的日子用 FinMind 補（官方優先）。
      # 補出來的日檔只存在這趟 job 裡：下面的 commit 只加指定的報告檔，
      # 絕對不要改成 git add data/ —— FinMind 條款不准轉散布原始資料。
      - name: 併入 FinMind 籌碼歷史
        if: inputs.mode == 'full'
        run: python finmind_chips.py --merge

      # revenue.yml 抓好的月營收（給「營收年增 > 0／≤ 0」濾網用）。沒跑過就沒有，那幾組會是 0 筆。
      - name: 還原月營收快取
        if: inputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data/revenue_raw
          key: revenue-raw-
          restore-keys: |
            revenue-raw-

      - name: 建月營收表
        if: inputs.mode == 'full'
        run: |
          if [ -f data/revenue_raw/manifest.json ]; then python revenue_fetch.py --panel-only; else echo "沒有月營收快取，略過"; fi

      - name: 重算指標
        if: inputs.mode == 'full'
        run: python indicators.py

      - name: 重跑回測
        if: inputs.mode == 'full'
        # --rally：疑似起漲／疑似起跌事件的三個事先登記（研究_起漲與型態 第 5 節），結果在 backtest.json 的 rally_rows
        run: python backtest.py --rules --exits --rally

      - name: 產生報告
        if: inputs.mode == 'full'
        run: python btreport.py

      - name: 回測標籤給主站用
        if: inputs.mode == 'full'
        run: python bttags.py

      # 只 commit 報告，不 commit 原始歷史 —— 那 110 MB 留在快取裡就好，
      # 進了 repo 之後每次 checkout 都要多下載一次，而且永遠刪不掉。
      - name: 推回報告
        if: inputs.mode == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backtest.json backtest.html data/daily.txt data/bt_tags.json
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "FinMind 補歷史後重跑回測（起始 ${{ inputs.start_date }}）"
            # --autostash：補完歷史之後 data/stock 底下上千個檔案都被改過但沒 commit，
            # 一般的 pull --rebase 碰到未提交的變動會直接拒絕。autostash 會先收起來、
            # rebase 完再放回去 —— 不能用 checkout 丟掉，那些檔案還要留給快取保存。
            git pull --rebase --autostash
            git push
          fi

      # 疑似起漲／疑似起跌逐筆清單（給 GPT 複核）。只放 Actions 下載區、保留 30 天，不 commit 進 repo。
      - name: 疑似起漲疑似起跌逐筆清單
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: rally-events
          path: rally_events.csv
          retention-days: 30
          if-no-files-found: warn

      # 就算前面哪一步失敗，也把已經算好的東西存成 artifact，
      # 不要讓幾小時的計算跟著一起消失。
      - name: 失敗時也把結果留下來
        if: failure() && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-output
          path: |
            backtest.json
            backtest.html
            data/daily.txt
          if-no-files-found: warn

      - name: 摘要
        if: inputs.mode == 'full'
        run: |
          echo "### 回測重跑完成" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("backtest.json", encoding="utf-8"))
          print("樣本期間 %s ~ %s，共 **%d** 個交易日\n" % (d["from"], d["to"], d["days"]))
          print("| 情境 | 方向 | 20 天超額 | t |")
          print("|---|---|---|---|")
          for r in d["rows"]:
              x = r["h"].get("20")
              if not x:
                  continue
              s = -1 if r["side"] == "空" else 1
              t = x["t"]
              print("| %s | %s | %+.2f%% | %s |" % (
                  r["name"], r["side"], s * x["excess"],
                  ("%+.1f" % (s * t)) if t is not None else "—"))
          if d.get("rally_rows"):
              print("\n#### 疑似起漲／疑似起跌（40 天，登記驗證期 2021-02～2025-08）\n")
              print("| 分組 | 筆數 | 超額（≥1億基準）| t | 比同流動性 | t | 淨 |")
              print("|---|---|---|---|---|---|---|")
              for r in d["rally_rows"]:
                  p = [x for x in r["periods"] if x["name"].startswith("登記驗證期")][0]
                  x = p["h"]["40"]
                  if "excess" not in x:
                      print("| %s | %d | — | — | — | — | — |" % (r["name"], x["n"]))
                      continue
                  f = lambda v: "—" if v is None else "%+.1f" % v
                  print("| %s | %d | %+.2f%% | %s | %+.2f%% | %s | %+.2f%% |" % (
                      r["name"], x["n"], x["excess"], f(x["t"]), x["vs_liq"], f(x["t_liq"]), x["net"]))
          EOF
