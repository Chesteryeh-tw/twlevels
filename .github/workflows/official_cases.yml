name: 官方日成交抽核（GPT 固定 6 案例）

# 手動跑一次就好。只抓證交所、櫃買官方公開的個股日成交與開市日，結果放下載區（保留 30 天），不 commit。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓官方日成交並重算 ②⑤
        run: python official_cases.py

      - name: 打包結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cases
          path: official_cases/
          retention-days: 30
          if-no-files-found: warn

      - name: 摘要
        if: always()
        run: |
          echo "### 官方日成交抽核" >> $GITHUB_STEP_SUMMARY
          [ -f official_cases/feature_check.csv ] && cat official_cases/feature_check.csv >> $GITHUB_STEP_SUMMARY || echo "沒有結果" >> $GITHUB_STEP_SUMMARY
